name: Integrate C2 roadmap task PRs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: c2-roadmap-pr-integration
  cancel-in-progress: false

jobs:
  integrate:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Integrate exact tested C2 heads
        env:
          EVENT_JSON: ${{ toJson(github.event.workflow_run.pull_requests) }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          for pr in json.loads(os.environ['EVENT_JSON']):
              branch = str(pr.get('head', {}).get('ref') or '')
              match = re.fullmatch(r'task/(\d{6})', branch)
              if match:
                  subprocess.run(['python3', 'tools/roadmap_repo_integration.py',
                                  'integrate', '--prompt-id', match.group(1)], check=True)
          PY
