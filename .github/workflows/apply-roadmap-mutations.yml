name: Apply roadmap mutation Issues

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: codex-roadmap-sqlite
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[roadmap-mutation] ')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Drain open mutation Issues, verify, and push race-safely
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pushed=0
          : > /tmp/processed-issues
          : > /tmp/rejected-issues

          for attempt in 1 2 3 4; do
            git fetch --quiet origin main
            git reset --hard origin/main
            git clean -fd
            : > /tmp/processed-issues
            : > /tmp/rejected-issues

            mapfile -t ISSUE_ROWS < <(
              gh issue list                 --repo "$GITHUB_REPOSITORY"                 --state open                 --limit 1000                 --json number,title,body                 --jq 'sort_by((if (.title | startswith("[roadmap-mutation] start-")) then 0 elif (.title | startswith("[roadmap-mutation] terminal-")) then 1 elif (.title | startswith("[roadmap-mutation] usage-")) then 2 else 3 end), .number)[] | select(.title | startswith("[roadmap-mutation] ")) | @base64'
            )

            if [ "${#ISSUE_ROWS[@]}" -eq 0 ]; then
              echo "No open roadmap mutation Issues"
              exit 0
            fi

            python3 tools/bootstrap_roadmap.py --repo . --writer-context

            for encoded in "${ISSUE_ROWS[@]}"; do
              printf '%s' "$encoded" | base64 --decode > /tmp/issue.json
              ISSUE_NUMBER="$(python3 -c 'import json; print(json.load(open("/tmp/issue.json"))["number"])')"
              python3 -c 'import json; issue=json.load(open("/tmp/issue.json", encoding="utf-8")); json.dump({"issue": issue}, open("/tmp/issue-event.json", "w", encoding="utf-8"))'
              echo "Applying roadmap mutation Issue #$ISSUE_NUMBER"
              if python3 tools/apply_issue_mutation.py --repo . --event /tmp/issue-event.json --defer-render > /tmp/apply-output 2>&1; then
                cat /tmp/apply-output
                python3 tools/roadmap_db.py --repo . verify
                printf '%s\n' "$ISSUE_NUMBER" >> /tmp/processed-issues
              else
                cat /tmp/apply-output >&2
                if python3 -c 'import json,sys; d=json.load(open("/tmp/issue-event.json")); sys.exit(0 if any(o.get("op")=="c2_cutover" for o in json.loads(d["issue"]["body"]).get("operations",[])) else 1)'; then
                  echo "C2 cutover rejected; stop the writer before any database commit" >&2
                  exit 1
                fi
                printf '%s\n' "$ISSUE_NUMBER" >> /tmp/rejected-issues
                echo "Rejected roadmap mutation Issue #$ISSUE_NUMBER; continuing drain" >&2
              fi
            done

            if [ -s /tmp/processed-issues ]; then
              PYTHONPATH=tools python3 -c 'from pathlib import Path; from roadmap_db import reconcile_prompt_file_locations, render; repo=Path("."); reconcile_prompt_file_locations(repo); render(repo)'
            fi
            python3 tools/roadmap_db.py --repo . verify

            if [ -z "$(git status --porcelain)" ]; then
              pushed=1
              break
            fi

            git add -A roadmap.sqlite roadmap.md spiegazioni.md prompt-registry.md obsidian prompts completed falliti
            ids="$(paste -sd, /tmp/processed-issues)"
            git commit -m "Apply roadmap mutation Issues #$ids"

            if git push origin HEAD:main; then
              pushed=1
              break
            fi

            if [ "$attempt" -eq 4 ]; then
              echo "Mutation push lost four consecutive ref races" >&2
              exit 1
            fi
          done

          test "$pushed" -eq 1

      - name: Close drained mutation Issues
        if: success()
        run: |
          set -euo pipefail
          if [ -s /tmp/processed-issues ]; then
            while IFS= read -r issue_number; do
              state="$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue_number" --jq .state)"
              if [ "$state" = "open" ]; then
                gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$issue_number/comments" \
                  -f body="Applied by the roadmap single writer."
                gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$issue_number" \
                  -f state=closed \
                  -f state_reason=completed
              fi
            done < /tmp/processed-issues
          fi

          if [ -s /tmp/rejected-issues ]; then
            while IFS= read -r issue_number; do
              state="$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue_number" --jq .state)"
              if [ "$state" = "open" ]; then
                gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$issue_number/comments" \
                  -f body="Rejected by the roadmap single writer; no mutation was applied. See Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$issue_number" \
                  -f state=closed \
                  -f state_reason=not_planned
              fi
            done < /tmp/rejected-issues
          fi
