name: Apply roadmap mutations

on:
  push:
    paths:
      - "mutations/inbox/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-roadmap-sqlite
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply, verify, and push race-safely
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            git fetch --quiet origin main
            git reset --hard origin/main

            python3 tools/bootstrap_roadmap.py --repo .
            python3 tools/apply_mutations.py --repo .
            python3 tools/roadmap_db.py --repo . verify

            if [ -z "$(git status --porcelain)" ]; then
              echo "No changes"
              exit 0
            fi

            git add -A roadmap.sqlite roadmap.md spiegazioni.md prompt-registry.md obsidian mutations prompts completed falliti
            git commit -m "Apply roadmap metadata mutation"

            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -eq 4 ]; then
              echo "Mutation push lost four consecutive ref races" >&2
              exit 1
            fi
          done
