name: Apply roadmap mutations

on:
  push:
    paths:
      - "mutations/inbox/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-roadmap-sqlite
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply mutations and verify
        run: |
          set -euo pipefail
          python3 tools/bootstrap_roadmap.py --repo .
          python3 tools/apply_mutations.py --repo .
          python3 tools/roadmap_db.py --repo . verify
      - name: Commit generated state
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A roadmap.sqlite roadmap.md spiegazioni.md prompt-registry.md obsidian mutations
          git commit -m "Apply roadmap metadata mutation"
          git push
