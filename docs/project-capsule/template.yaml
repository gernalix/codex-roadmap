commands:
  setup: {not_applicable: Explain why setup is unnecessary.}
  build: {not_applicable: Explain why there is no build.}
  test_targeted: {argv: [python3, -m, pytest, tests/test_example.py], cwd: .}
  test_full: {argv: [python3, -m, pytest], cwd: .}
